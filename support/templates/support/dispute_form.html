{% extends "base.html" %}
{% block title %}Lapor masalah{% endblock %}
{% block content %}
<div class="card mx-auto max-w-xl">
  <h1>Lapor masalah</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Kirim laporan</button>
  </form>
  <p class="mt-4"><a href="{% url 'support:dispute_list' %}">Lihat laporanku</a></p>
</div>
{% endblock %}
