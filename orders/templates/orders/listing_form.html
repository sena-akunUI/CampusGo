{% extends "base.html" %}
{% block title %}Buat postingan{% endblock %}
{% block content %}
<div class="card mx-auto max-w-xl">
  <h1>Buat postingan</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Kirim</button>
  </form>
  <p class="mt-4"><a href="{% url 'orders:listing_list' %}">Kembali ke papan</a></p>
</div>
{% endblock %}
