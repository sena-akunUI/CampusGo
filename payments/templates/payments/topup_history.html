<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Riwayat Top-up - CampusGO</title>
</head>
<body>
    <h1>Riwayat Top-up</h1>

    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}

    <table border="1">
        <tr><th>Tanggal</th><th>Nominal</th><th>Status</th></tr>
        {% for t in topups %}
        <tr>
            <td>{{ t.created_at }}</td>
            <td>Rp{{ t.amount }}</td>
            <td>{{ t.get_status_display }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3">Belum ada top-up.</td></tr>
        {% endfor %}
    </table>

    <p><a href="{% url 'payments:topup_create' %}">Top-up lagi</a></p>
</body>
</html>
