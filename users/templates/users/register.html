{% extends "base.html" %}
{% block title %}Daftar{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl">
  <div class="card p-8">
    <h1 id="form-title" class="text-2xl font-bold tracking-tight text-slate-900">Buat akun CampusGo</h1>
    <p class="mt-1 mb-6 text-sm text-slate-600">Sudah punya akun? <a href="{% url 'users:login' %}" class="font-semibold text-brand-600 hover:underline">Masuk</a></p>
    <form method="post" aria-labelledby="form-title">
      {% csrf_token %}
      {% include "partials/form_fields.html" with form=form %}
      <button type="submit" class="btn-primary mt-1 min-h-12 w-full text-base">Buat akun</button>
    </form>
  </div>
</div>
{% endblock %}
